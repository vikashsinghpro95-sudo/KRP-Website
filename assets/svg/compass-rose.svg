<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none" role="img" aria-label="Compass Rose Watermark">
  <circle cx="200" cy="200" r="190" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  <circle cx="200" cy="200" r="170" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="200" r="130" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <circle cx="200" cy="200" r="90" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4" opacity="0.4"/>
  <circle cx="200" cy="200" r="8" fill="currentColor" opacity="0.8"/>
  
  <!-- 8 Cardinal and Intercardinal Points -->
  <!-- North -->
  <polygon points="200,20 208,185 200,195" fill="currentColor" opacity="0.9"/>
  <polygon points="200,20 192,185 200,195" fill="currentColor" opacity="0.4"/>
  <!-- South -->
  <polygon points="200,380 192,215 200,205" fill="currentColor" opacity="0.9"/>
  <polygon points="200,380 208,215 200,205" fill="currentColor" opacity="0.4"/>
  <!-- East -->
  <polygon points="380,200 215,208 205,200" fill="currentColor" opacity="0.9"/>
  <polygon points="380,200 215,192 205,200" fill="currentColor" opacity="0.4"/>
  <!-- West -->
  <polygon points="20,200 185,192 195,200" fill="currentColor" opacity="0.9"/>
  <polygon points="20,200 185,208 195,200" fill="currentColor" opacity="0.4"/>

  <!-- NE -->
  <polygon points="327,73 205,190 200,200" fill="currentColor" opacity="0.7"/>
  <polygon points="327,73 195,195 200,200" fill="currentColor" opacity="0.3"/>
  <!-- NW -->
  <polygon points="73,73 195,205 200,200" fill="currentColor" opacity="0.7"/>
  <polygon points="73,73 190,195 200,200" fill="currentColor" opacity="0.3"/>
  <!-- SE -->
  <polygon points="327,327 205,210 200,200" fill="currentColor" opacity="0.7"/>
  <polygon points="327,327 210,205 200,200" fill="currentColor" opacity="0.3"/>
  <!-- SW -->
  <polygon points="73,327 190,205 200,200" fill="currentColor" opacity="0.7"/>
  <polygon points="73,327 205,210 200,200" fill="currentColor" opacity="0.3"/>

  <!-- Degree ticks -->
  <line x1="200" y1="5" x2="200" y2="15" stroke="currentColor" stroke-width="2"/>
  <line x1="200" y1="385" x2="200" y2="395" stroke="currentColor" stroke-width="2"/>
  <line x1="5" y1="200" x2="15" y2="200" stroke="currentColor" stroke-width="2"/>
  <line x1="385" y1="200" x2="395" y2="200" stroke="currentColor" stroke-width="2"/>
</svg>
