  <rect x="90" y="110" width="160" height="180" rx="8" fill="#060D2B" stroke="#2E62F0" stroke-width="1.5"/>
  <rect x="110" y="130" width="120" height="30" rx="4" fill="#FFCB3D" opacity="0.8"/>
  <text x="170" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#B9C4E4" text-anchor="middle">Personal Bed &amp; Storage</text>
  
  <rect x="290" y="110" width="210" height="180" rx="8" fill="#060D2B" stroke="#2E62F0" stroke-width="1.5"/>
  <line x1="320" y1="220" x2="470" y2="220" stroke="#FFB800" stroke-width="2"/>
  <rect x="360" y="140" width="70" height="50" rx="4" fill="#1D3FA8" stroke="#FFF" stroke-width="1"/>
  <text x="395" y="255" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#B9C4E4" text-anchor="middle">Ergonomic Study Station</text>
  
  <!-- Banner Tag -->
  <rect x="170" y="80" width="260" height="34" rx="17" fill="#0A1A4F" stroke="#FFB800" stroke-width="1.5"/>
  <text x="300" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFB800" text-anchor="middle" letter-spacing="0.1em">BOYS' RESIDENCE WING</text>
  <text x="300" y="320" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#FFF" opacity="0.7" text-anchor="middle">Photo Placeholder (Replace with verified Boys' Hostel photo)</text>
