  <polygon points="480,85 486,110 480,105 474,110" fill="#FFB800"/>
  <text x="300" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FFB800" text-anchor="middle" letter-spacing="0.1em">GTO GROUND &amp; SSB TRAINING AREA</text>
  <text x="300" y="335" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7" text-anchor="middle">Physical &amp; Obstacle Course · Photo Placeholder</text>
