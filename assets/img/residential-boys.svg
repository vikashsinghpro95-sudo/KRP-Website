<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <rect width="600" height="400" fill="#0A1A4F"/>
  <!-- Dotted pattern -->
  <g opacity="0.15">
    <circle cx="50" cy="50" r="2" fill="#FFF"/><circle cx="100" cy="50" r="2" fill="#FFF"/><circle cx="150" cy="50" r="2" fill="#FFF"/><circle cx="200" cy="50" r="2" fill="#FFF"/><circle cx="250" cy="50" r="2" fill="#FFF"/><circle cx="300" cy="50" r="2" fill="#FFF"/><circle cx="350" cy="50" r="2" fill="#FFF"/><circle cx="400" cy="50" r="2" fill="#FFF"/><circle cx="450" cy="50" r="2" fill="#FFF"/><circle cx="500" cy="50" r="2" fill="#FFF"/><circle cx="550" cy="50" r="2" fill="#FFF"/>
  </g>
  <!-- Architectural Room Layout Line Art -->
  <rect x="60" y="60" width="480" height="280" rx="16" fill="#102670" stroke="#FFB800" stroke-width="2"/>
