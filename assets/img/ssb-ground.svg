  <rect x="50" y="50" width="500" height="300" rx="12" fill="#102670" stroke="#FFB800" stroke-width="2"/>
  <!-- Obstacle ground lines -->
  <line x1="80" y1="280" x2="520" y2="280" stroke="#FFB800" stroke-width="3"/>
  <!-- Obstacle ropes, parallel beams, zig-zag -->
  <path d="M120 280 L120 180 L200 180 L200 280" stroke="#FFCB3D" stroke-width="4"/>
  <path d="M250 280 L270 200 L330 200 L350 280" stroke="#2E62F0" stroke-width="4"/>
  <path d="M390 280 L420 150 L460 280" stroke="#FFCB3D" stroke-width="4"/>
